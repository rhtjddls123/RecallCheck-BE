events {}

http {
  client_max_body_size 20M;

  server {
    listen 80;
    server_name recall-check.site api.recall-check.site;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name recall-check.site;

    ssl_certificate /etc/letsencrypt/live/recall-check.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recall-check.site/privkey.pem;

    location / {
      return 301 https://recall-check-fe.vercel.app$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name api.recall-check.site;

    ssl_certificate /etc/letsencrypt/live/api.recall-check.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.recall-check.site/privkey.pem;

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }
  }
}